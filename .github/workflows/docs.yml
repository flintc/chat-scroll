name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the workspace packages so docs example imports resolve.
      - run: pnpm -r --filter "./packages/*" build

      # The base path is `/<repo-name>/` for project-pages deployments.
      # Adjust if you serve from a custom domain (use `/`) or user-pages.
      - name: Build docs
        env:
          DOCS_BASE: /chat-scroll/
        run: pnpm --filter docs build

      # GitHub Pages requires a `.nojekyll` file when serving Vite-style
      # `_assets` directories.
      - run: touch docs/.vitepress/dist/.nojekyll

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
